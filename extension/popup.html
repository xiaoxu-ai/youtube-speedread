<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    /* 配色与 A3 图标一致：纸白 / 墨 / 朱红 */
    :root {
      --red: #C9372A;
      --red-2: #A82B20;
      --ink: #1B1C20;
      --muted: #6B675E;
      --line: #E0D7C3;
      --bg: #FAF6EC;
      --soft: #F3ECDD;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --red: #FF6152; --red-2: #FF8375;
        --ink: #EDE6D6; --muted: #9C968A; --line: #32343A;
        --bg: #16171A; --soft: #1E2025;
      }
    }
    /* Chromium 151/macOS 在扩展来源缩放不为 100% 时，可能把 popup
       外框算得比固定正文更宽。html 保留正常的 330px 基准，body
       则跟随实际视口，避免右侧留下空白。 */
    html { min-width: 330px; }
    body {
      width: 100%; min-width: 330px; margin: 0; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      font-size: 14px; color: var(--ink); background: var(--bg);
    }
    header { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    header img { width: 26px; height: 26px; border-radius: 6px; box-shadow: 0 1px 3px rgba(60,45,20,.15); }
    header .name { font-size: 15px; font-weight: 650; letter-spacing: .2px; }
    header .en { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .status {
      background: var(--soft); border-radius: 9px; padding: 11px 12px;
      color: var(--muted); line-height: 1.5; word-break: break-word;
      margin-bottom: 10px; font-size: 13px;
    }
    .status.error { background: rgba(201,55,42,.10); color: var(--red); }
    .status.success { background: rgba(31,122,72,.12); color: #1F7A48; }

    .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 10px; display: none; }
    .bar.on { display: block; }
    .bar > i { display: block; height: 100%; width: 0%; background: var(--red); border-radius: 3px; transition: width .35s ease; }
    .bar.indet > i { width: 35%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

    .meta { font-size: 12px; color: var(--muted); line-height: 1.55; margin-bottom: 10px; display: none; }
    .meta.on { display: block; }
    .meta b { color: var(--ink); font-weight: 600; }

    button {
      width: 100%; padding: 11px; border: none; border-radius: 8px;
      background: var(--red); color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: filter .15s;
    }
    button:hover:not(:disabled) { background: var(--red-2); }
    button:disabled { background: var(--line); color: var(--muted); cursor: default; }
    button.ghost {
      background: transparent; color: var(--red);
      border: 1.5px solid var(--red); margin-top: 8px;
    }
    button.ghost:hover { background: rgba(201,55,42,.08); }

    footer { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    a { color: var(--muted); font-size: 12px; text-decoration: none; cursor: pointer; }
    a:hover { color: var(--red); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" />
    <div>
      <div class="name">油管速读</div>
      <div class="en">YT SpeedRead</div>
    </div>
  </header>

  <div id="status" class="status">在 YouTube 视频页点下面的按钮，字幕会被提取、翻译成中文并提炼要点。</div>

  <div id="bar" class="bar"><i id="barFill"></i></div>
  <div id="meta" class="meta"></div>

  <button id="btnProcess">开始速读</button>
  <button id="btnOpen" class="ghost" style="display:none;">打开上次结果</button>

  <footer>
    <a id="linkOptions">⚙ 设置</a>
    <a id="linkReset">清除任务状态</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
