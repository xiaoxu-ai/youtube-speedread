<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- A: 播放键化作文字行 —— 左边是视频，右边是读出来的字 -->
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22242B"/>
      <stop offset="1" stop-color="#131418"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="29" fill="url(#bgA)"/>
  <rect x="1.75" y="1.75" width="124.5" height="124.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3.5"/>

  <!-- 播放楔形：左侧实心，代表视频 -->
  <path d="M35 36.5 L35 91.5 L66 64 Z" fill="#FF2D46"/>

  <!-- 三条文字线：由播放键“流出”，逐条变淡变短 -->
  <rect x="74" y="46"   width="30" height="8" rx="4" fill="#F7F3EA"/>
  <rect x="74" y="60"   width="24" height="8" rx="4" fill="#F7F3EA" opacity="0.72"/>
  <rect x="74" y="74"   width="16" height="8" rx="4" fill="#F7F3EA" opacity="0.44"/>
</svg>
